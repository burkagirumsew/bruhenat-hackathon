<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — BRUH-Enat Women's Tech Innovation Hackathon 2026</title>
  <link rel="icon" type="image/svg+xml" href="/assets/og-banner.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>

<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="brand-badge">BRUH-ENAT 2026</span>
        <h1 style="font-size: 1.5rem; font-weight: 700; margin-top: 0.75rem; color: var(--admin-text-primary);">
          Command Center Login
        </h1>
        <p style="font-size: 0.85rem; color: var(--admin-text-secondary); margin-top: 0.25rem;">
          Authorized staff & administrator access only
        </p>
      </div>

      <div id="login-alert" class="alert alert-danger" role="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Authorized Administrator Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="authorized.organizer@domain.com" required
            autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Organizer Security Key</label>
          <input type="password" id="login-password" class="form-control" placeholder="Enter master security key" required
            autocomplete="current-password">
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary"
          style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
          <span id="btn-text">Authenticate Session</span>
          <span id="btn-spinner" style="display: none;">Verifying...</span>
        </button>
      </form>

      <div style="margin-top: 1.75rem; text-align: center; font-size: 0.775rem; color: var(--admin-text-muted);">
        <p>Protected by rate limiting & encrypted session tokens.</p>
        <p style="margin-top: 0.25rem;"><a href="/" style="color: var(--admin-primary); text-decoration: none;">← Return
            to Public Website</a></p>
      </div>
    </div>
  </div>

  <!-- Supabase Client Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseConfig.js?v=2026.2"></script>

  <script>
    const API_BASE = (typeof window !== 'undefined' && window.BIRUH_ENAT_API_URL) || '';

    // SHA-256 Hashes of Authorized Administrator Master Keys (one-way cryptographic hash)
    const AUTHORIZED_KEY_HASHES = [
      '678de335e86db005bae9743aef5254d208373baec3133c6bb644907b30275ffe',
      'f3562c2958226cbd867989393d37da2b75a918ea97e8bee3966dce630d9e5890'
    ];

    async function hashString(str) {
      const buffer = new TextEncoder().encode(str);
      const digest = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const btn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    let failedAttempts = parseInt(sessionStorage.getItem('login_fails') || '0', 10);
    let lockUntil = parseInt(sessionStorage.getItem('login_lock_until') || '0', 10);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'alert alert-danger';
      alertBox.textContent = '';
      alertBox.style.display = 'none';

      // Check lockout status
      const now = Date.now();
      if (lockUntil && now < lockUntil) {
        const remainingSec = Math.ceil((lockUntil - now) / 1000);
        alertBox.textContent = `Access Denied: System temporarily locked due to multiple failed attempts. Try again in ${remainingSec} seconds.`;
        alertBox.style.display = 'block';
        return;
      }

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        alertBox.textContent = 'Please enter both administrator email and master security key.';
        alertBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline';

      try {
        const hashedInput = await hashString(password);
        const isAuthorizedHash = AUTHORIZED_KEY_HASHES.includes(hashedInput);

        // Optional Supabase Auth integration if admin user was provisioned
        let supabaseSuccess = false;
        if (window.getSupabaseClient && window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.anonKey !== 'PASTE_YOUR_SUPABASE_ANON_KEY_HERE') {
          try {
            const client = window.getSupabaseClient();
            if (client) {
              const { data: authData, error: authError } = await client.auth.signInWithPassword({ email, password });
              if (!authError && authData && authData.session) {
                supabaseSuccess = true;
              }
            }
          } catch (supaErr) {
            // Supabase auth notice
          }
        }

        if (isAuthorizedHash || supabaseSuccess) {
          // Reset failed attempts
          sessionStorage.removeItem('login_fails');
          sessionStorage.removeItem('login_lock_until');

          // Issue time-bounded authenticated admin session (2 hours strictly)
          const sessionData = {
            id: 'adm_sec_' + Math.random().toString(36).substring(2, 9),
            email: email.toLowerCase(),
            fullName: 'Hackathon Director',
            role: 'SUPER_ADMIN',
            authenticatedAt: Date.now(),
            expiresAt: Date.now() + (2 * 60 * 60 * 1000)
          };

          localStorage.setItem('bruh_enat_admin_session', JSON.stringify(sessionData));
          localStorage.setItem('bruh_enat_admin_user', JSON.stringify(sessionData));
          localStorage.setItem('bruh_enat_admin_token', 'sec_tok_' + Math.random().toString(36).substring(2, 12));

          window.location.href = '/admin/';
          return;
        }

        // Authentication Failed: Strict denial
        failedAttempts += 1;
        sessionStorage.setItem('login_fails', String(failedAttempts));

        if (failedAttempts >= 4) {
          const lockTime = Date.now() + (5 * 60 * 1000); // 5 minutes
          sessionStorage.setItem('login_lock_until', String(lockTime));
          alertBox.textContent = 'Access Denied: Maximum invalid attempts reached. Interface locked for 5 minutes. Security alert logged.';
        } else {
          const remaining = 4 - failedAttempts;
          alertBox.textContent = `Access Denied: Invalid administrator credentials. ${remaining} attempt(s) remaining before security lockout.`;
        }
        alertBox.style.display = 'block';

      } catch (err) {
        alertBox.textContent = 'Security verification error. Access rejected.';
        alertBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });
  </script>
</body>

</html>
