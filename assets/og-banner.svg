<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B0E"/>
      <stop offset="50%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient Glow Spheres (Rich Warm Orange) -->
  <circle cx="200" cy="150" r="220" fill="#EA580C" opacity="0.22" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="250" fill="#F97316" opacity="0.18" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="300" fill="#C2410C" opacity="0.15" filter="url(#glow)"/>

  <!-- Border Card Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#F97316" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Top Badge -->
  <rect x="80" y="80" width="450" height="40" rx="20" fill="#1C1F2B" stroke="#F97316" stroke-width="1" stroke-opacity="0.4"/>
  <text x="105" y="106" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FBBF24" letter-spacing="1.5">
    DECEMBER 5, 2026 • ADDIS ABABA, ETHIOPIA
  </text>

  <!-- Wordmark & Subtitle -->
  <text x="80" y="210" font-family="system-ui, sans-serif" font-size="76" font-weight="900" fill="url(#brandGrad)" letter-spacing="-1">
    BRUH-ENAT
  </text>
  <text x="560" y="205" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="#FBBF24">
    ብሩህ እናት
  </text>

  <text x="80" y="275" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">
    WOMEN'S TECH INNOVATION HACKATHON 2026
  </text>

  <!-- Tagline -->
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#F97316" letter-spacing="3">
    EMPOWER. PROTECT. TRANSFORM.
  </text>

  <!-- Theme -->
  <text x="80" y="395" font-family="system-ui, sans-serif" font-size="28" font-style="italic" font-weight="600" fill="#F4EFEB">
    “Her Safety, Our Innovation: Building Safer Futures.”
  </text>

  <!-- Divider -->
  <line x1="80" y1="440" x2="1120" y2="440" stroke="#F97316" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Co-organizers List -->
  <text x="80" y="490" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#A8A29E" letter-spacing="2">
    CO-ORGANIZED BY
  </text>
  <text x="80" y="528" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">
    ALX Ethiopia  •  UN Women  •  Enat Bank  •  MiNT (Ministry of Innovation &amp; Tech)
  </text>
  <text x="80" y="555" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#FB923C">
    Venue: Capstone ALX Tech Hub, Lideta, Addis Ababa
  </text>
</svg>
